<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TimeShift 3D — A Calm World That Follows Your Time</title>
<meta name="description" content="A realistic, relaxing 3D world that shifts with your local time — morning light, soft sunsets, and quiet nights in one continuous scene." />
<meta name="theme-color" content="#0a1020" id="theme-color" />
<meta property="og:title" content="TimeShift 3D" />
<meta property="og:description" content="A calm 3D world that follows your local time." />
<meta property="og:type" content="website" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23ffc873'/%3E%3Cstop offset='1' stop-color='%23ff9a5a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='28' r='12' fill='url(%23g)'/%3E%3Cpath d='M8 44c8-10 16-14 24-14s16 4 24 14' fill='none' stroke='%23eef2f8' stroke-width='3' stroke-linecap='round' opacity='.55'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" aria-hidden="true"></div>
  <div id="css-sky" hidden aria-hidden="true"></div>

  <div id="loader">
    <div class="loader-inner">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72">
          <defs><linearGradient id="logoSun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc873"/><stop offset="1" stop-color="#ff9a5a"/></linearGradient></defs>
          <circle class="logo-sun" cx="32" cy="26" r="13" fill="url(#logoSun)"/>
          <path d="M10 42c7.5-9 15-13 22-13s14.5 4 22 13" fill="none" stroke="rgba(238,242,248,.55)" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M16 48c5.5-6.5 11-9.5 16-9.5s10.5 3 16 9.5" fill="none" stroke="rgba(238,242,248,.32)" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="loader-title">TIMESHIFT<span>3D</span></div>
      <div class="loader-bar"><div id="loader-fill"></div></div>
      <div class="loader-hint" id="loader-hint">Preparing the world…</div>
    </div>
  </div>

  <div id="ui" class="ui-root">
    <header class="hud hud-clock" id="hud-clock">
      <div class="clock-row">
        <div class="hud-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="28" height="28">
            <defs><linearGradient id="hudSun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc873"/><stop offset="1" stop-color="#ff9a5a"/></linearGradient></defs>
            <circle cx="32" cy="26" r="12" fill="url(#hudSun)"/>
            <path d="M12 42c6.5-8 13-11.5 20-11.5s13.5 3.5 20 11.5" fill="none" stroke="rgba(238,242,248,.5)" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="clock-time" id="clock-time">--:--</div>
      </div>
      <div class="clock-greet" id="clock-greet">GOOD DAY</div>
      <div class="clock-sub"><span class="dot"></span><span id="clock-mode">LOCAL TIME</span><span class="sep">•</span><span id="clock-tz">—</span></div>
    </header>

    <div class="hud hud-hint" id="hud-hint">DRAG TO EXPLORE · SCROLL TO ZOOM · TAP TO HIDE UI</div>

    <div class="hud hud-tools" id="hud-tools">
      <button type="button" class="tool-btn" id="btn-mute" title="Mute" aria-label="Mute audio">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </button>
      <button type="button" class="tool-btn" id="btn-quality" title="Quality" aria-label="Quality">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3zm6 10l.9 2.7L22 17l-3.1.9L18 21l-.9-3.1L14 17l3.1-.9L18 13z"/></svg>
      </button>
      <button type="button" class="tool-btn" id="btn-fullscreen" title="Fullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
      <div class="quality-menu" id="quality-menu" hidden>
        <button type="button" data-q="auto">Auto</button>
        <button type="button" data-q="low">Low</button>
        <button type="button" data-q="high">High</button>
      </div>
    </div>

    <div class="hud hud-scrub" id="hud-scrub">
      <input type="range" id="time-scrub" min="0" max="24" step="0.01" value="12" aria-label="Time of day" />
      <div class="scrub-labels"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
      <div class="scrub-actions">
        <button type="button" class="scrub-btn" id="btn-timelapse" title="Play a full day (~60s)">▶ Day</button>
        <button type="button" class="scrub-btn" id="btn-pause-time" title="Pause time (Space)">❚❚</button>
      </div>
    </div>

    <nav class="hud hud-modes" id="hud-modes" aria-label="Time mode">
      <button class="mode-btn active" data-mode="auto"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="mode-label">AUTO</span></button>
      <button class="mode-btn" data-mode="morning"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="14" r="4" fill="currentColor"/><path d="M4 18h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/></svg></span><span class="mode-label">MORNING</span></button>
      <button class="mode-btn" data-mode="day"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg></span><span class="mode-label">DAY</span></button>
      <button class="mode-btn" data-mode="sunset"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 16a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="14" r="3" fill="currentColor"/></svg></span><span class="mode-label">SUNSET</span></button>
      <button class="mode-btn" data-mode="night"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M15.5 4.5a7.5 7.5 0 1 0 4 12.2A6.2 6.2 0 1 1 15.5 4.5z" fill="currentColor"/></svg></span><span class="mode-label">NIGHT</span></button>
    </nav>
  </div>

  <div id="debug" class="debug" hidden>FPS —</div>
  <div id="webgl-fail" hidden><div class="fail-inner"><p>WebGL is not available in this browser.</p><p class="fail-sub">Enjoy the soft sky fallback instead.</p></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
