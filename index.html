<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TimeShift 3D — A World That Follows Your Time</title>
<meta name="description" content="Pengalaman dunia 3D realistis yang berubah mengikuti waktu lokal pengguna." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23ffc873'/%3E%3Cstop offset='1' stop-color='%23ff9a5a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='28' r='12' fill='url(%23g)' opacity='.95'/%3E%3Cpath d='M8 44c8-10 16-14 24-14s16 4 24 14' fill='none' stroke='%23eef2f8' stroke-width='3' stroke-linecap='round' opacity='.55'/%3E%3Cpath d='M14 50c6-7 12-10 18-10s12 3 18 10' fill='none' stroke='%23eef2f8' stroke-width='2.2' stroke-linecap='round' opacity='.35'/%3E%3C/svg%3E" />
</head>
<body>

  <div id="app" aria-hidden="true"></div>

  <!-- Loading overlay -->
  <div id="loader">
    <div class="loader-inner">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72">
          <defs>
            <linearGradient id="logoSun" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#ffc873"/>
              <stop offset="1" stop-color="#ff9a5a"/>
            </linearGradient>
          </defs>
          <circle class="logo-sun" cx="32" cy="26" r="13" fill="url(#logoSun)"/>
          <path d="M10 42c7.5-9 15-13 22-13s14.5 4 22 13" fill="none" stroke="rgba(238,242,248,.55)" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M16 48c5.5-6.5 11-9.5 16-9.5s10.5 3 16 9.5" fill="none" stroke="rgba(238,242,248,.32)" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="loader-title">TIMESHIFT<span>3D</span></div>
      <div class="loader-bar"><div id="loader-fill"></div></div>
      <div class="loader-hint">Menyiapkan dunia…</div>
    </div>
  </div>

  <!-- HUD: jam & salam + logo mark -->
  <header class="hud hud-clock" id="hud-clock">
    <div class="clock-row">
      <div class="hud-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="28" height="28">
          <defs>
            <linearGradient id="hudSun" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#ffc873"/>
              <stop offset="1" stop-color="#ff9a5a"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="26" r="12" fill="url(#hudSun)"/>
          <path d="M12 42c6.5-8 13-11.5 20-11.5s13.5 3.5 20 11.5" fill="none" stroke="rgba(238,242,248,.5)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="clock-time" id="clock-time">--:--</div>
    </div>
    <div class="clock-greet" id="clock-greet">HELLO</div>
    <div class="clock-sub"><span class="dot"></span><span id="clock-mode">LOCAL TIME</span> • <span id="clock-period">—</span></div>
  </header>

  <!-- HUD: hint kamera -->
  <div class="hud hud-hint" id="hud-hint">DRAG TO EXPLORE&ensp;·&ensp;SCROLL / PINCH TO ZOOM</div>

  <!-- HUD: mode waktu — relaxed symbols -->
  <nav class="hud hud-modes" id="hud-modes" aria-label="Time mode">
    <button class="mode-btn active" data-mode="auto" title="Auto time">
      <span class="mode-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span class="mode-label">AUTO</span>
    </button>
    <button class="mode-btn" data-mode="morning" title="Morning">
      <span class="mode-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="14" r="4" fill="currentColor" opacity=".9"/><path d="M4 18h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/></svg>
      </span>
      <span class="mode-label">MORNING</span>
    </button>
    <button class="mode-btn" data-mode="day" title="Day">
      <span class="mode-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".7"><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/></g></svg>
      </span>
      <span class="mode-label">DAY</span>
    </button>
    <button class="mode-btn" data-mode="sunset" title="Sunset">
      <span class="mode-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 16a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 19h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/><circle cx="12" cy="14" r="3" fill="currentColor" opacity=".85"/></svg>
      </span>
      <span class="mode-label">SUNSET</span>
    </button>
    <button class="mode-btn" data-mode="night" title="Night">
      <span class="mode-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15.5 4.5a7.5 7.5 0 1 0 4 12.2A6.2 6.2 0 1 1 15.5 4.5z" fill="currentColor"/></svg>
      </span>
      <span class="mode-label">NIGHT</span>
    </button>
  </nav>

  <div id="webgl-fail" hidden>
    <p>WebGL tidak tersedia di perangkat/browser ini.</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
